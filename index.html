<!DOCTYPE html>
<html>
  <script>
    function enableAllControls(){ 
      document.querySelectorAll('input, select, textarea, button')
        .forEach(el => el.disabled = false);
    }
    window.addEventListener('DOMContentLoaded', enableAllControls);
    window.addEventListener('pageshow', enableAllControls);
</script>
  <head>
    <title>Resolution Cascade</title>
  </head>
  <body>
    <h1>Hello from Resolution Cascade</h1>
    <button id="go-to-config">Go to Config Page</button>

    <script src="renderer.js"></script>
  </body>
</html>
